name: Build Android

on:
  push:
    branches: [ main, temp-main, 'devin/**' ]
    paths:
      - 'android-chat/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main, temp-main ]
    paths:
      - 'android-chat/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-chat/**/*.gradle*', 'android-chat/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: android-chat
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-chat
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and verify APK
        working-directory: android-chat
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f
          ls -lh chat/build/outputs/apk/debug/ || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spark-im-debug-apk
          path: android-chat/chat/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
