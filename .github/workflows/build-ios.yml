name: Build iOS

on:
  push:
    branches: [ main, temp-main, 'devin/**' ]
    paths:
      - 'ios-chat/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ main, temp-main ]
    paths:
      - 'ios-chat/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        working-directory: ios-chat/wfchat
        run: xcodebuild -project WildFireChat.xcodeproj -list

      - name: Build iOS App (No Code Sign)
        working-directory: ios-chat/wfchat
        run: |
          xcodebuild build \
            -project WildFireChat.xcodeproj \
            -scheme WildFireChat \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -50

      - name: Verify build output
        run: |
          echo "iOS build completed successfully"
          find ios-chat/wfchat/build -name "*.app" 2>/dev/null | head -5 || echo "Build artifacts in derived data"
