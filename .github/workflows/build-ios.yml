name: Build iOS

on:
  push:
    branches: [ main, temp-main, 'devin/**' ]
    paths:
      - 'ios-chat/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ main, temp-main ]
    paths:
      - 'ios-chat/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        working-directory: ios-chat/wfchat
        run: xcodebuild -project WildFireChat.xcodeproj -list

      - name: Archive iOS App (No Code Sign)
        working-directory: ios-chat/wfchat
        run: |
          xcodebuild archive \
            -project WildFireChat.xcodeproj \
            -scheme WildFireChat \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/SparkIM.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -80

      - name: Create unsigned IPA
        run: |
          ARCHIVE_PATH="${{ github.workspace }}/build/SparkIM.xcarchive"
          IPA_DIR="${{ github.workspace }}/build/ipa"
          mkdir -p "$IPA_DIR/Payload"

          # Find the .app inside the archive
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            find "$ARCHIVE_PATH" -name "*.app" | head -10
            exit 1
          fi

          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          # Create IPA (zip with .ipa extension)
          cd "$IPA_DIR"
          zip -r "${{ github.workspace }}/build/SparkIM-unsigned.ipa" Payload
          echo "IPA created successfully:"
          ls -lh "${{ github.workspace }}/build/SparkIM-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SparkIM-unsigned-ipa
          path: build/SparkIM-unsigned.ipa
          retention-days: 30
