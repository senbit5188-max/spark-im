# Nginx site config for spark-im production server
#
# Apply with:
#   sudo cp docs/nginx/spark-im.conf /etc/nginx/sites-available/spark-im
#   sudo ln -sf /etc/nginx/sites-available/spark-im /etc/nginx/sites-enabled/spark-im
#   sudo nginx -t && sudo systemctl reload nginx
#
# Notes:
# - Pre-compressed .gz assets are produced by `npm run build` (see web-chat/vue.config.js).
#   `gzip_static on` lets nginx serve them directly without re-compressing on every request.
# - Adjust `server_name` if you are using a different domain than telvoro.top.

# --- Landing page ---
server {
    server_name telvoro.top www.telvoro.top;
    root /opt/spark-im/landing-page;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/telvoro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telvoro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- Web chat ---
server {
    server_name chat.telvoro.top;
    root /opt/spark-im/web-chat;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Disable caching for HTML files (so users always pick up the latest hashed assets)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache hashed assets for 1 year (Vue CLI emits content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to app-server (port 8888)
    location ~ ^/(login_pwd|login|send_code|send_reset_code|reset_pwd|change_pwd|scan_pc|confirm_pc|cancel_pc|session_login|put_group_announcement|get_group_announcement|amr2mp3|avatar|appVersion|is_support_multi_call_kit|pc_config|get_remote_settings|update_remote_settings) {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /things/  { proxy_pass http://127.0.0.1:8888; proxy_set_header Host $host; }
    location /fav/     { proxy_pass http://127.0.0.1:8888; proxy_set_header Host $host; }
    location /logs/    { proxy_pass http://127.0.0.1:8888; proxy_set_header Host $host; }

    # Proxy IM server route + file server (port 8080)
    location /route { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /fs    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }

    # WebSocket proxy for MQTT-over-WS (port 8083 = ws-mqtt-proxy.js)
    location /mqtt {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/telvoro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telvoro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- Admin panel ---
server {
    server_name admin.telvoro.top;
    root /opt/spark-im/admin-panel;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;

    # Restrict admin to LAN/VPN/known IPs in production. Uncomment and adjust the allow rules:
    #allow 10.0.0.0/8;
    #allow 192.168.0.0/16;
    #allow 203.0.113.0/24;   # office/VPN egress
    #deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy admin API to IM server (port 18080)
    # NOTE: The admin API uses a shared secret (`http.admin.secret_key` in wildfirechat.conf).
    # MUST be changed from the default `123456` before exposing publicly.
    location /admin/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/telvoro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telvoro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- Mobile API endpoint ---
server {
    server_name api.telvoro.top;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/telvoro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telvoro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
