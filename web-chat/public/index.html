<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#07c160">
    <meta name="description" content="星火 IM —— 安全、高效、即时的全平台通讯。支持 Web / Android / iOS / 桌面端。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="星火IM">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <!-- Open Graph / Twitter Card -->
    <meta property="og:title" content="星火 IM">
    <meta property="og:description" content="安全、高效、即时的全平台通讯">
    <meta property="og:type" content="website">
    <meta property="og:image" content="<%= BASE_URL %>icons/icon-512.png">
    <meta name="twitter:card" content="summary">

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>apple-touch-icon.png">

    <!-- PWA -->
    <link rel="manifest" href="<%= BASE_URL %>manifest.webmanifest">

    <!-- Fonts (preconnect for faster handshake) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>星火 IM</title>

    <style>
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }

      /* Pre-paint loader so users see something instantly while JS bundles parse.
         The Vue app mounts into #app and replaces this skeleton. */
      html, body { margin: 0; padding: 0; height: 100%; background: #ededed; color: #181818; }
      #app-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        background: #ededed; color: #181818; z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loader.fade-out { opacity: 0; pointer-events: none; }
      #app-loader .brand {
        display: flex; align-items: center; gap: 14px;
        font-size: 26px; font-weight: 700; letter-spacing: 1px;
      }
      #app-loader .brand img { width: 48px; height: 48px; border-radius: 12px; }
      #app-loader .brand .accent {
        background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #app-loader .spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(0, 0, 0, 0.08);
        border-top-color: #07c160;
        border-radius: 50%;
        animation: spk-spin 0.9s linear infinite;
      }
      #app-loader .hint { font-size: 13px; color: rgba(24, 24, 24, 0.5); }
      @keyframes spk-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, body, #app-loader { background: #0a0e17; color: #e0e6ed; }
        #app-loader .hint { color: rgba(224, 230, 237, 0.5); }
        #app-loader .spinner { border-color: rgba(255, 255, 255, 0.1); border-top-color: #07c160; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app-loader" aria-label="Loading 星火 IM">
      <div class="brand">
        <img src="<%= BASE_URL %>icons/icon-192.png" alt="" aria-hidden="true">
        <span><span class="accent">星火</span> IM</span>
      </div>
      <div class="spinner" role="status" aria-label="Loading"></div>
      <div class="hint">正在为你加载安全通讯通道…</div>
    </div>
    <div id="app"></div>
    <script>
      // Hide the pre-paint loader once the Vue app has mounted (#app contains content)
      (function () {
        var attempts = 0;
        var t = setInterval(function () {
          attempts++;
          var app = document.getElementById('app');
          var loader = document.getElementById('app-loader');
          if (app && app.children.length > 0 && loader) {
            loader.classList.add('fade-out');
            setTimeout(function () {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }, 500);
            clearInterval(t);
          } else if (attempts > 80) {
            // 8s safety bail-out
            clearInterval(t);
          }
        }, 100);
      })();
    </script>
    <!-- built files will be auto injected -->
  </body>
</html>
